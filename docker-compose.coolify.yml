version: '3.8'

networks:
  coolify:
    external: true

services:
  hattie-api:
    container_name: hattie-api
    networks:
      - coolify
      - default
    build:
      context: .
      dockerfile: HattieAI.API/Dockerfile
    environment:
      - 'ConnectionStrings__DefaultConnection=${CONNECTION_STRING}'
      - 'Gemini__ApiKey=${GEMINI_API_KEY}'
      - 'ENCRYPTION_KEY=${ENCRYPTION_KEY}'
      - 'ASPNETCORE_URLS=http://+:8080'
    restart: always
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hattie-api.rule=Host(`hattie-api.touchpointe.digital`)" # Change this if you have a different API domain
      - "traefik.http.services.hattie-api.loadbalancer.server.port=8080"

  hattie-portal:
    container_name: hattie-portal
    networks:
      - coolify
      - default
    build:
      context: .
      dockerfile: HattieAI.Portal/Dockerfile
    environment:
      - 'ConnectionStrings__DefaultConnection=${CONNECTION_STRING}'
      - 'Gemini__ApiKey=${GEMINI_API_KEY}'
      - 'ENCRYPTION_KEY=${ENCRYPTION_KEY}'
      - 'Chatbot__PublicUrl=${CHATBOT_PUBLIC_URL}'
      - 'ApiSettings__BaseUrl=http://hattie-api:8080'
      - 'ASPNETCORE_URLS=http://+:8080'
    depends_on:
      - hattie-api
    restart: always
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hattie-portal.rule=Host(`hattie-portal.touchpointe.digital`)"
      - "traefik.http.routers.hattie-portal.entrypoints=websecure"
      - "traefik.http.routers.hattie-portal.tls=true"
      - "traefik.http.services.hattie-portal.loadbalancer.server.port=8080"
